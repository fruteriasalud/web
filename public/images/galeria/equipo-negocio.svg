<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="equipo-negocio-title">
  <title id="equipo-negocio-title">Ilustración del equipo de Frutería Salud tras el mostrador del puesto</title>
  <defs>
    <linearGradient id="en-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#eadff3"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#en-bg)"/>
  <circle cx="120" cy="140" r="130" fill="#e5f2df" opacity="0.6"/>
  <circle cx="680" cy="120" r="110" fill="#fbe3ea" opacity="0.5"/>

  <!-- counter -->
  <rect x="80" y="420" width="640" height="90" rx="16" fill="#c08a52"/>
  <rect x="80" y="420" width="640" height="24" rx="12" fill="#e3b47a"/>

  <!-- produce on counter -->
  <circle cx="140" cy="410" r="20" fill="#b3134d"/>
  <circle cx="185" cy="416" r="16" fill="#e8892c"/>
  <circle cx="640" cy="412" r="18" fill="#317a3d"/>
  <circle cx="680" cy="418" r="15" fill="#f5c344"/>

  <!-- person 1 -->
  <g>
    <circle cx="270" cy="270" r="46" fill="#f3c9a3"/>
    <path d="M224 270 C224 240 246 220 270 220 C294 220 316 240 316 270" fill="#5d3e1c"/>
    <rect x="222" y="316" width="96" height="110" rx="24" fill="#b3134d"/>
    <rect x="240" y="330" width="60" height="70" rx="14" fill="#fbe3ea"/>
  </g>

  <!-- person 2 -->
  <g>
    <circle cx="410" cy="260" r="48" fill="#e3ab74"/>
    <path d="M362 260 C362 224 386 200 410 200 C436 200 458 224 458 260" fill="#261b20"/>
    <rect x="360" y="308" width="100" height="118" rx="24" fill="#317a3d"/>
    <rect x="380" y="322" width="60" height="72" rx="14" fill="#e5f2df"/>
  </g>

  <!-- person 3 -->
  <g>
    <circle cx="545" cy="272" r="44" fill="#c98a5c"/>
    <path d="M501 272 C501 244 521 224 545 224 C569 224 589 244 589 272" fill="#7c5430"/>
    <rect x="499" y="316" width="92" height="108" rx="22" fill="#eadff3"/>
    <rect x="517" y="330" width="56" height="66" rx="12" fill="#ffffff"/>
  </g>

  <!-- sign -->
  <g>
    <rect x="300" y="90" width="220" height="54" rx="14" fill="#ffffff" stroke="#eaded5" stroke-width="2"/>
    <text x="410" y="125" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#b3134d">Frutería Salud</text>
  </g>
</svg>
