  <!-- crates on lower shelf -->
  <g>
    <rect x="170" y="486" width="90" height="54" rx="8" fill="#7c5430"/>
    <rect x="280" y="486" width="90" height="54" rx="8" fill="#7c5430"/>
    <rect x="390" y="486" width="90" height="54" rx="8" fill="#7c5430"/>
    <rect x="500" y="486" width="90" height="54" rx="8" fill="#7c5430"/>
    <rect x="170" y="486" width="90" height="54" rx="8" fill="none" stroke="#5d3e1c" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="280" y="486" width="90" height="54" rx="8" fill="none" stroke="#5d3e1c" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="390" y="486" width="90" height="54" rx="8" fill="none" stroke="#5d3e1c" stroke-opacity="0.3" stroke-width="3"/>
    <rect x="500" y="486" width="90" height="54" rx="8" fill="none" stroke="#5d3e1c" stroke-opacity="0.3" stroke-width="3"/>
