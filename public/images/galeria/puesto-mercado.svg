<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="puesto-mercado-title">
  <title id="puesto-mercado-title">Ilustración del puesto de mercado con toldo y estanterías de producto</title>
  <defs>
