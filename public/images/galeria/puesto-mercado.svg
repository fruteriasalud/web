  <g>
    <circle cx="195" cy="378" r="24" fill="#317a3d"/>
    <circle cx="250" cy="378" r="24" fill="#e14b72"/>
    <circle cx="305" cy="378" r="24" fill="#e8892c"/>
    <circle cx="360" cy="378" r="24" fill="#8fc46a"/>
