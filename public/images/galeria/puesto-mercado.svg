  <!-- produce rows shelf 1 -->
  <g>
    <circle cx="195" cy="278" r="24" fill="#b3134d"/>
    <circle cx="250" cy="278" r="24" fill="#e8892c"/>
    <circle cx="305" cy="278" r="24" fill="#f5c344"/>
    <circle cx="360" cy="278" r="24" fill="#317a3d"/>
    <circle cx="415" cy="278" r="24" fill="#b3134d"/>
