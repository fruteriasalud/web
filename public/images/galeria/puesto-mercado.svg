    <path d="M100 190 L133 190 L118 230 Z" fill="#b3134d"/>
    <path d="M133 190 L166 190 L151 230 Z" fill="#fff8ec"/>
    <path d="M166 190 L199 190 L184 230 Z" fill="#b3134d"/>
    <path d="M199 190 L232 190 L217 230 Z" fill="#fff8ec"/>
    <path d="M232 190 L265 190 L250 230 Z" fill="#b3134d"/>
    <path d="M265 190 L298 190 L283 230 Z" fill="#fff8ec"/>
    <path d="M298 190 L331 190 L316 230 Z" fill="#b3134d"/>
    <path d="M331 190 L364 190 L349 230 Z" fill="#fff8ec"/>
    <path d="M364 190 L397 190 L382 230 Z" fill="#b3134d"/>
    <path d="M397 190 L430 190 L415 230 Z" fill="#fff8ec"/>
    <path d="M430 190 L463 190 L448 230 Z" fill="#b3134d"/>
    <path d="M463 190 L496 190 L481 230 Z" fill="#fff8ec"/>
    <path d="M496 190 L529 190 L514 230 Z" fill="#b3134d"/>
    <path d="M529 190 L562 190 L547 230 Z" fill="#fff8ec"/>
    <path d="M562 190 L595 190 L580 230 Z" fill="#b3134d"/>
    <path d="M595 190 L628 190 L613 230 Z" fill="#fff8ec"/>
    <path d="M628 190 L661 190 L646 230 Z" fill="#b3134d"/>
    <path d="M661 190 L700 190 L682 230 Z" fill="#fff8ec"/>
  </g>

  <!-- stall structure -->
