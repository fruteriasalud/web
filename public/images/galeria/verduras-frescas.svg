<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="verduras-frescas-title">
  <title id="verduras-frescas-title">Ilustración de verduras y hortalizas frescas</title>
  <defs>
    <linearGradient id="vf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#eadff3"/>
    </linearGradient>
    <linearGradient id="vf-crate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c08a52"/>
      <stop offset="100%" stop-color="#93602f"/>
    </linearGradient>
    <radialGradient id="vf-tomato" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e14b72"/>
      <stop offset="100%" stop-color="#b3134d"/>
    </radialGradient>
    <radialGradient id="vf-carrot" cx="35%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#f7ae5c"/>
      <stop offset="100%" stop-color="#e8892c"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#vf-bg)"/>
  <circle cx="120" cy="120" r="140" fill="#e5f2df" opacity="0.7"/>
  <circle cx="680" cy="470" r="130" fill="#fbe3ea" opacity="0.5"/>

  <!-- crate -->
  <g>
    <rect x="120" y="410" width="560" height="140" rx="18" fill="url(#vf-crate)"/>
    <rect x="150" y="438" width="500" height="12" rx="6" fill="#7c5430"/>
    <rect x="150" y="474" width="500" height="12" rx="6" fill="#7c5430"/>
    <rect x="150" y="510" width="500" height="12" rx="6" fill="#7c5430"/>
  </g>

  <!-- lettuce -->
  <g>
    <circle cx="220" cy="360" r="72" fill="#8fc46a"/>
    <circle cx="220" cy="360" r="72" fill="none" stroke="#204f28" stroke-width="3" stroke-opacity="0.35"/>
    <path d="M170 360 C190 320 250 320 270 360 C250 400 190 400 170 360 Z" fill="#e5f2df" opacity="0.5"/>
    <path d="M160 340 C185 300 255 300 280 340" fill="none" stroke="#317a3d" stroke-width="6" stroke-linecap="round"/>
    <path d="M175 390 C195 415 245 415 265 390" fill="none" stroke="#204f28" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- tomatoes -->
  <g>
    <circle cx="360" cy="380" r="52" fill="url(#vf-tomato)"/>
    <path d="M360 330 C350 316 372 314 378 326 C368 332 366 328 360 330 Z" fill="#317a3d"/>
    <ellipse cx="342" cy="360" rx="11" ry="15" fill="#ffffff" opacity="0.25"/>
  </g>
  <g>
    <circle cx="430" cy="410" r="40" fill="url(#vf-tomato)"/>
    <path d="M430 372 C423 362 438 360 442 369" fill="#317a3d"/>
  </g>

  <!-- carrots -->
  <g>
    <path d="M520 320 L556 460 L544 468 L508 328 Z" fill="url(#vf-carrot)"/>
    <path d="M556 460 C566 470 560 486 548 480 Z" fill="url(#vf-carrot)"/>
    <path d="M524 320 C516 296 496 284 480 288" fill="none" stroke="#317a3d" stroke-width="6" stroke-linecap="round"/>
    <path d="M528 320 C532 294 552 280 568 284" fill="none" stroke="#317a3d" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g>
    <path d="M590 340 L620 460 L610 466 L580 346 Z" fill="url(#vf-carrot)"/>
    <path d="M594 340 C588 318 572 308 558 312" fill="none" stroke="#204f28" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- pepper -->
  <path d="M470 340 C450 350 448 390 470 410 C495 428 530 414 528 384 C526 356 494 336 470 340 Z" fill="#e8892c"/>
  <path d="M488 340 C486 326 498 318 508 322" fill="none" stroke="#317a3d" stroke-width="5" stroke-linecap="round"/>
</svg>
