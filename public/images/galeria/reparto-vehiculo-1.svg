<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="reparto-vehiculo-1-title">
  <title id="reparto-vehiculo-1-title">Ilustración de una furgoneta de reparto vista de lado</title>
  <defs>
    <linearGradient id="rv1-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#fbe3ea"/>
    </linearGradient>
    <linearGradient id="rv1-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e14b72"/>
      <stop offset="100%" stop-color="#b3134d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#rv1-bg)"/>
  <circle cx="640" cy="140" r="150" fill="#eadff3" opacity="0.45"/>

  <!-- road -->
  <rect x="0" y="470" width="800" height="20" fill="#eaded5"/>
  <rect x="60" y="478" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="200" y="478" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="340" y="478" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="480" y="478" width="60" height="6" rx="3" fill="#ffffff"/>
  <rect x="620" y="478" width="60" height="6" rx="3" fill="#ffffff"/>

  <!-- van body -->
  <g>
    <path d="M140 300 C140 280 156 268 178 268 L470 268 C492 268 508 280 520 300 L600 340 C612 344 620 356 620 370 L620 440 L140 440 Z" fill="url(#rv1-body)"/>
    <path d="M470 268 L470 340 L600 340 L520 300 C508 280 492 268 470 268 Z" fill="#83113d"/>
    <!-- windows -->
    <rect x="500" y="286" width="80" height="46" rx="10" fill="#eadff3"/>
    <!-- cargo box graphic on side -->
    <rect x="190" y="330" width="120" height="80" rx="10" fill="#fff8ec"/>
    <rect x="215" y="352" width="24" height="24" fill="#317a3d"/>
    <rect x="245" y="352" width="24" height="24" fill="#e8892c"/>
    <rect x="215" y="380" width="24" height="10" fill="#93602f"/>
    <rect x="245" y="380" width="24" height="10" fill="#93602f"/>
    <!-- bumper/base -->
    <rect x="140" y="420" width="480" height="20" rx="8" fill="#83113d"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="230" cy="450" r="38" fill="#261b20"/>
    <circle cx="230" cy="450" r="16" fill="#eaded5"/>
    <circle cx="520" cy="450" r="38" fill="#261b20"/>
    <circle cx="520" cy="450" r="16" fill="#eaded5"/>
  </g>

  <!-- headlight -->
  <circle cx="608" cy="360" r="10" fill="#fff8ec"/>
</svg>
