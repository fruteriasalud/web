<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="preparacion-pedidos-title">
  <title id="preparacion-pedidos-title">Ilustración de la preparación de un encargo en una caja con lista de comprobación</title>
  <defs>
    <linearGradient id="pp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#e5f2df"/>
    </linearGradient>
    <linearGradient id="pp-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3b47a"/>
      <stop offset="100%" stop-color="#c08a52"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#pp-bg)"/>
  <circle cx="660" cy="130" r="140" fill="#fbe3ea" opacity="0.55"/>
  <circle cx="100" cy="500" r="120" fill="#eadff3" opacity="0.5"/>

  <!-- table -->
  <rect x="60" y="470" width="680" height="20" rx="10" fill="#eaded5"/>

  <!-- open box -->
  <g>
    <path d="M240 300 L520 300 L560 470 L200 470 Z" fill="url(#pp-box)"/>
    <path d="M200 470 L560 470 L560 480 L200 480 Z" fill="#93602f" opacity="0.4"/>
    <path d="M240 300 L280 260 L480 260 L520 300 Z" fill="#f3d5a8"/>
    <path d="M240 300 L280 260" stroke="#93602f" stroke-width="4" fill="none"/>
    <path d="M520 300 L480 260" stroke="#93602f" stroke-width="4" fill="none"/>
  </g>

  <!-- produce peeking from box -->
  <circle cx="320" cy="290" r="34" fill="#b3134d"/>
  <circle cx="390" cy="278" r="30" fill="#e8892c"/>
  <circle cx="450" cy="292" r="32" fill="#317a3d"/>
  <path d="M320 260 C316 250 326 246 332 250" fill="none" stroke="#204f28" stroke-width="4" stroke-linecap="round"/>

  <!-- clipboard -->
  <g>
    <rect x="560" y="330" width="150" height="190" rx="14" fill="#ffffff" stroke="#eaded5" stroke-width="3"/>
    <rect x="605" y="322" width="60" height="20" rx="8" fill="#b3134d"/>
    <rect x="580" y="366" width="18" height="18" rx="5" fill="#317a3d"/>
    <path d="M584 375 L589 380 L596 369" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="608" y="368" width="80" height="10" rx="5" fill="#eaded5"/>
    <rect x="580" y="404" width="18" height="18" rx="5" fill="#317a3d"/>
    <path d="M584 413 L589 418 L596 407" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="608" y="406" width="80" height="10" rx="5" fill="#eaded5"/>
    <rect x="580" y="442" width="18" height="18" rx="5" fill="#fbe3ea"/>
    <rect x="608" y="444" width="60" height="10" rx="5" fill="#eaded5"/>
  </g>

  <!-- hands placing item -->
  <g>
    <path d="M420 240 C400 220 370 224 360 246 C352 264 366 280 386 278 C382 292 396 306 412 300 C430 294 432 274 420 258 Z" fill="#f3c9a3"/>
    <circle cx="450" cy="252" r="20" fill="#b3134d"/>
  </g>
</svg>
